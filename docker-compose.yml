services:
  postgres:
    image: postgres:16-alpine
    container_name: flyrank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-flyrank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flyrank123}
      POSTGRES_DB: ${DB_NAME:-flyrank_widgets}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flyrank} -d ${DB_NAME:-flyrank_widgets}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
